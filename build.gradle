// Shared build configuration for the Minecraft 26.2 Fabric port.
plugins {
	id 'architectury-plugin' version '3.5-SNAPSHOT'
	id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
	id 'com.gradleup.shadow' version '9.2.2' apply false
}

architectury {
	minecraft = project.minecraft_version
}

allprojects {
	apply plugin: 'java-library'
	apply plugin: 'architectury-plugin'

	group = rootProject.maven_group
	version = '2.2.1-26.2'

	configurations {
		common {
			canBeResolved = true
			canBeConsumed = false
		}
		compileClasspath.extendsFrom common
		runtimeClasspath.extendsFrom common

		shadowBundle {
			canBeResolved = true
			canBeConsumed = false
		}
	}

	repositories {
		maven {
			name = 'LocalMaven'
			url = uri("${rootProject.projectDir}/gradle/local-maven")
		}
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.shedaniel.me/' }
		maven { url = 'https://maven.terraformersmc.com/' }
		exclusiveContent {
			forRepository {
				maven {
					name = 'CurseMaven'
					url = 'https://cursemaven.com'
				}
			}
			filter { includeGroup 'curse.maven' }
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'Modrinth'
					url = 'https://api.modrinth.com/maven'
				}
			}
			filter { includeGroup 'maven.modrinth' }
		}
		mavenCentral()
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 25
	}

	def runtimeJavaVersion = Integer.parseInt(rootProject.findProperty('runtime_java_version')?.toString() ?: '25')
	tasks.withType(JavaExec).configureEach {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(runtimeJavaVersion)
		}
		systemProperty 'minecraft.username', rootProject.properties.getOrDefault('minecraft_username', 'Player')
	}
}

subprojects {
	apply plugin: 'dev.architectury.loom-no-remap'

	base {
		archivesName = "${rootProject.name}-${project.name}"
	}

	dependencies {
		minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
	}

	if (project.name == 'fabric') {
		tasks.named('runClient', JavaExec).configure {
			def username = rootProject.properties.getOrDefault('minecraft_username', 'Player')
			args '--username', username
		}
	}
}
