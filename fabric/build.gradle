plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
	shadowSqlite
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
}

dependencies {
	implementation project(":common")
	common(project(path: ":common", configuration: "namedElements")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
	
	// Fabric Loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Optional compat mods (dev only)
	modCompileOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false } // GlitchCore
	modLocalRuntime("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }
	// Loom 1.6 在 dev runtime 下可能忽略 modLocalRuntime，因此补充 modRuntimeOnly 确保 runClient 能加载依赖
	modRuntimeOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }
	
	// Architectury API - 内嵌到模组中
	modImplementation("dev.architectury:architectury-fabric:9.2.14") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("dev.architectury:architectury-fabric:9.2.14")
	
	// Cloth Config API for Fabric
	modApi("me.shedaniel.cloth:cloth-config-fabric:11.1.106") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("me.shedaniel.cloth:cloth-config-fabric:11.1.106")

	// SQLite JDBC - 道路数据持久化（内嵌到模组）
	// developmentFabric 确保开发环境下驱动可用
	developmentFabric("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
	shadowSqlite("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "architectury.common.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowSqlite]
	archiveClassifier.set("dev-shadow")
	
	// 重定位 SQLite JDBC 包，长度设为 10 以便进行二进制等长替换
	// org.sqlite (10) -> net.road.w (10)
	relocate 'org.sqlite', 'net.road.w'
	
	// 强制更新 META-INF/services 里的类名
	mergeServiceFiles()
}

// 修复 SQLite Native 库中的 JNI 符号
import java.nio.file.*
task fixSqliteNatives {
	doLast {
		File file = shadowJar.archiveFile.get().asFile
		if (!file.exists()) return

		Path zipPath = file.toPath()
		
		FileSystem fs = FileSystems.newFileSystem(zipPath, null as ClassLoader)
		try {
			Files.walk(fs.getPath("/")).filter { 
				it.toString().endsWith(".dll") || it.toString().endsWith(".so") || it.toString().endsWith(".dylib") 
			}.forEach { nativePath ->
				println "Patching native symbols in: " + nativePath
				byte[] bytes = Files.readAllBytes(nativePath)
				
				// 替换 "org_sqlite" -> "net_road_w" (JNI 符号)
				// 替换 "org/sqlite" -> "net/road/w" (内部路径)
				bytes = replaceBytesInternal(bytes, "org_sqlite".getBytes("UTF-8"), "net_road_w".getBytes("UTF-8"))
				bytes = replaceBytesInternal(bytes, "org/sqlite".getBytes("UTF-8"), "net/road/w".getBytes("UTF-8"))
				
				Files.write(nativePath, bytes)
			}
		} finally {
			fs.close()
		}
	}
}

// 辅助方法：执行等长字节替换
def replaceBytesInternal(byte[] source, byte[] target, byte[] replacement) {
	if (target.length != replacement.length) return source
	for (int i = 0; i <= source.length - target.length; i++) {
		boolean match = true
		for (int j = 0; j < target.length; j++) {
			if (source[i + j] != target[j]) {
				match = false
				break
			}
		}
		if (match) {
			for (int j = 0; j < target.length; j++) {
				source[i + j] = replacement[j]
			}
		}
	}
	return source
}

shadowJar.finalizedBy(fixSqliteNatives)

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package with shaded common (network package) in dev runtime
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}
