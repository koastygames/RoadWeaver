// Fabric-only Minecraft 26.2 build. Minecraft 26.2 is unobfuscated, so no remapJar step is used.
plugins {
	id 'com.gradleup.shadow'
}

architectury {
	fabric()
}

def enableModMenuDevRuntime = providers.gradleProperty("fabric_enable_modmenu")
	.map(String::toBoolean)
	.getOrElse(false)

def compatFabricDir = layout.buildDirectory.dir("generated/sources/roadweaver26/main/java")

configurations {
	shadowCommon
	shadowH2
	developmentFabric.extendsFrom common
}

repositories {
	maven {
		url = "https://maven.shedaniel.me/"
		name = "Shedaniel Maven"
	}
}

dependencies {
	common(project(path: ":common")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "dev.architectury:architectury-fabric:${project.architectury_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	implementation("io.github.llamalad7:mixinextras-fabric:0.5.0")

	if (enableModMenuDevRuntime) {
		runtimeOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
			transitive = false
		}
	}

	compileOnly("com.h2database:h2:2.2.224") { transitive = false }
	runtimeOnly("com.h2database:h2:2.2.224") { transitive = false }
	shadowH2("com.h2database:h2:2.2.224") { transitive = false }
}

processResources {
	def modVersion = project.version.toString()
	def mcVersion = rootProject.minecraft_version.toString()
	inputs.property "version", modVersion
	inputs.property "minecraft_version", mcVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "minecraft_version": mcVersion
	}
}

// Copy the Fabric implementation into a 26.2 source tree while leaving legacy UI/datagen code in Git.
tasks.register("generateRoadWeaverFabric26Compat", Copy) {
	from("src/main/java")
	into(compatFabricDir)

	// Runtime does not need Fabric datagen, and the 26.2 API has replaced FabricDataOutput.
	exclude 'net/shiroha233/datagen/**'

	// Minecraft 26.2 replaced the legacy client GUI/render-state APIs.
	exclude 'net/shiroha233/roadweaver/client/**'
	exclude 'net/shiroha233/roadweaver/network/fabric/MapNetworkFabric.java'
	exclude 'net/shiroha233/roadweaver/mixin/fabric/CreateWorldScreenMixin.java'
	exclude 'net/shiroha233/roadweaver/mixin/fabric/CreateWorldScreenInitMixin.java'
	exclude 'net/shiroha233/roadweaver/mixin/fabric/LevelLoadingScreenMixin.java'
	exclude 'net/shiroha233/roadweaver/mixin/fabric/BiomeGrassColorFailSafeMixin.java'

	doLast {
		def target = compatFabricDir.get().file("net/shiroha233/roadweaver/network/fabric/MapNetworkFabric.java").asFile
		target.parentFile.mkdirs()
		target.text = '''package net.shiroha233.roadweaver.network.fabric;

import net.minecraft.server.level.ServerPlayer;

/**
 * Minecraft 26.2 core compatibility shim.
 * Legacy map/config GUI networking is disabled until the GUI is migrated to GuiGraphicsExtractor.
 */
public final class MapNetworkFabric {
    private MapNetworkFabric() {}

    public static void registerServerReceivers() {
        // UI packet path intentionally disabled for the 26.2 core port.
    }

    public static void syncMapAccess(ServerPlayer player) {
        // No map UI receiver is installed in the 26.2 core port.
    }
}
'''
	}
}

shadowJar {
	configurations = [project.configurations.shadowCommon, project.configurations.shadowH2]
	archiveClassifier.set("")

	exclude "architectury.common.json"
	relocate 'org.h2', 'net.shiroha233.roadweaver.libs.h2'

	exclude 'META-INF/versions/**'
	exclude 'org/h2/util/SourceCompiler*'
	exclude 'org/h2/tools/**'
	exclude 'org/h2/server/**'
	exclude 'net/shiroha233/roadweaver/libs/h2/util/SourceCompiler*'
	exclude 'net/shiroha233/roadweaver/libs/h2/tools/**'
	exclude 'net/shiroha233/roadweaver/libs/h2/server/**'
	mergeServiceFiles()
	exclude 'module-info.class'

	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

jar {
	archiveClassifier.set("dev")
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	dependsOn tasks.named('generateRoadWeaverFabric26Compat')
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

tasks.named('compileJava') {
	dependsOn tasks.named('generateRoadWeaverFabric26Compat')
}

tasks.named('build') {
	dependsOn tasks.named('shadowJar')
}

sourceSets {
	main {
		java.setSrcDirs([compatFabricDir])
		resources {
			exclude 'assets/roadweaver/lang/*.json'
			exclude 'pack.mcmeta'
		}
	}
}
