plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
	shadowSqlite
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
}

dependencies {
	implementation project(":common")
	common(project(path: ":common", configuration: "namedElements")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
	
	// Fabric Loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Optional compat mods (dev only)
	modCompileOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false } // GlitchCore
	modCompileOnly("maven.modrinth:e0bNACJD:4RgDk9NB") { transitive = false } // SereneSeasons Fabric 1.20.1 9.1.0.0
	modLocalRuntime("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }
	modLocalRuntime("maven.modrinth:e0bNACJD:4RgDk9NB") { transitive = false }
	
	// Architectury API - 内嵌到模组中
	modImplementation("dev.architectury:architectury-fabric:9.2.14") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("dev.architectury:architectury-fabric:9.2.14")
	
	// Cloth Config API for Fabric
	modApi("me.shedaniel.cloth:cloth-config-fabric:11.1.106") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("me.shedaniel.cloth:cloth-config-fabric:11.1.106")

	// SQLite JDBC - 道路数据持久化（内嵌到模组）
	// developmentFabric 确保开发环境下驱动可用
	developmentFabric("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
	shadowSqlite("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "architectury.common.json"
	configurations = [project.configurations.shadowCommon, project.configurations.shadowSqlite]
	relocate "org.sqlite", "net.shiroha233.roadweaver.libs.sqlite"
	archiveClassifier.set("dev-shadow")
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package with shaded common (network package) in dev runtime
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}
