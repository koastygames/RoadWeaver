plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url "https://maven.shedaniel.me/"
		name "Shedaniel Maven"
	}
}

dependencies {
	implementation project(":common")
	common(project(path: ":common", configuration: "namedElements")) { transitive = false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }
	
	// Fabric Loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Architectury API - 内嵌到模组中
	modImplementation("dev.architectury:architectury-fabric:${project.architectury_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("dev.architectury:architectury-fabric:${project.architectury_version}")
	
	// Cloth Config API for Fabric
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
	
	modRuntimeOnly "maven.modrinth:VSNURh3q:${project.c2me_version}"
	
	modCompileOnly "maven.modrinth:mOgUt4GM:${project.modmenu_version}"
	modRuntimeOnly "maven.modrinth:mOgUt4GM:${project.modmenu_version}"
	modCompileOnly "maven.modrinth:eXts2L7r:${project.placeholder_api_version}"
	modRuntimeOnly "maven.modrinth:eXts2L7r:${project.placeholder_api_version}"
	
	// H2 Database - 道路数据持久化（纯Java，无native依赖）
	common("com.h2database:h2:2.2.224") { transitive = false }
	include("com.h2database:h2:2.2.224") { transitive = false }
	
	// SQLJet - 纯Java SQLite读取器，用于旧数据迁移（无native依赖）
	common("org.tmatesoft.sqljet:sqljet:1.1.15") { transitive = false }
	include("org.tmatesoft.sqljet:sqljet:1.1.15") { transitive = false }
	// SQLJet 依赖 antlr-runtime
	common("org.antlr:antlr-runtime:3.5.3") { transitive = false }
	include("org.antlr:antlr-runtime:3.5.3") { transitive = false }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

shadowJar {
	exclude "architectury.common.json"
	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package with shaded common (network package) in dev runtime
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}
