name: Build WorldWeaver 1.21.1 NeoForge

on:
  push:
    branches:
      - worldweaver-neoforge-1.21.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Compile and verify
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Verify installable JAR exists
        run: |
          test -f build/libs/worldweaver-1.0.0.jar
          jar tf build/libs/worldweaver-1.0.0.jar | grep -q 'META-INF/neoforge.mods.toml'
          jar tf build/libs/worldweaver-1.0.0.jar | grep -q 'worldweaver.mixins.json'

      - name: NeoForge server and worldgen smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          : > server-smoke.log

          setsid ./gradlew runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          booted=0

          for i in $(seq 1 100); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' server-smoke.log; then
              booted=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if kill -0 "$server_pid" 2>/dev/null; then
            kill -- -"$server_pid" 2>/dev/null || kill "$server_pid" 2>/dev/null || true
          fi
          wait "$server_pid" 2>/dev/null || true

          cat server-smoke.log

          if [ "$booted" -ne 1 ]; then
            echo 'WorldWeaver smoke test failed: server did not reach the normal Done state.' >&2
            exit 1
          fi

          if grep -Eq 'Mixin apply failed|MixinTransformerError|Exception in server tick loop|Failed to start the minecraft server' server-smoke.log; then
            echo 'WorldWeaver smoke test detected a fatal startup/worldgen error.' >&2
            exit 1
          fi

      - name: Upload WorldWeaver JAR
        uses: actions/upload-artifact@v4
        with:
          name: WorldWeaver-NeoForge-1.21.1
          path: build/libs/worldweaver-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
