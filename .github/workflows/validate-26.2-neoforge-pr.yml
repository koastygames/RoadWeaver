name: Validate RoadWeaver 26.2 NeoForge PR

on:
  pull_request:
    branches:
      - 26.2-Fabric
    paths:
      - 'common/**'
      - 'neoforge/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build-26.2-neoforge.yml'
      - '.github/workflows/validate-26.2-neoforge-pr.yml'

permissions:
  contents: read

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build NeoForge 26.2
        run: ./gradlew :neoforge:build --stacktrace --warning-mode all

      - name: Upload NeoForge JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roadweaver-26.2-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev.jar
            !neoforge/build/libs/*-sources.jar
