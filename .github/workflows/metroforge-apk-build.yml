name: MetroForge APK Build Temp

on:
  push:
    branches:
      - metroforge-apk-build-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct MetroForge source archive
        shell: bash
        run: |
          cat metroforge-build/part_*.b64 > /tmp/metroforge-source.b64
          base64 --decode /tmp/metroforge-source.b64 > /tmp/metroforge-source.zip
          echo "0a84ee2de779824df4b6c6cab076f1b5a2c6ccc8bec1faa7f1915d893ec1b155  /tmp/metroforge-source.zip" | sha256sum -c -
          unzip -q /tmp/metroforge-source.zip -d "$GITHUB_WORKSPACE/metroforge-src"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: metroforge-src/MetroForgeCity
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s metroforge-src/MetroForgeCity/app/build/outputs/apk/debug/app-debug.apk
          sha256sum metroforge-src/MetroForgeCity/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MetroForge-compiled-apk
          path: metroforge-src/MetroForgeCity/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
