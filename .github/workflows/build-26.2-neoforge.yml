name: Build RoadWeaver 26.2 NeoForge

on:
  push:
    branches:
      - 26.2-NeoForge
  pull_request:
    branches:
      - 26.2-Fabric
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build NeoForge 26.2 JAR
        run: ./gradlew :neoforge:build --stacktrace --warning-mode all

      - name: Collect release JAR
        if: success()
        run: |
          mkdir -p dist
          find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' -print -exec cp {} dist/ \;
          ls -lah dist

      - name: Upload NeoForge JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roadweaver-26.2-neoforge
          path: dist/*.jar
          if-no-files-found: error
