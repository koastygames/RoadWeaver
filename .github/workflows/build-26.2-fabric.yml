name: Build Minecraft 26.2 Fabric

on:
  push:
    branches:
      - 26.2-Fabric
  pull_request:
    branches:
      - 1.21.11-Architectury
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Fabric 26.2
        run: ./gradlew :fabric:build --stacktrace --warning-mode all

      - name: Smoke-test dedicated server startup
        shell: bash
        run: |
          mkdir -p fabric/run
          echo 'eula=true' > fabric/run/eula.txt

          set +e
          timeout 90s ./gradlew :fabric:runServer --args='nogui' > /tmp/roadweaver-server.log 2>&1
          run_status=$?
          set -e

          cat /tmp/roadweaver-server.log

          if [ -f fabric/run/logs/latest.log ]; then
            cat fabric/run/logs/latest.log
            if grep -Fq 'Done (' fabric/run/logs/latest.log; then
              echo 'RoadWeaver 26.2 dedicated server reached the running state.'
              exit 0
            fi
          fi

          echo "Dedicated server did not reach the running state (exit ${run_status})."
          exit 1

      - name: Upload Fabric JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roadweaver-26.2-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
            !fabric/build/libs/*-sources.jar
