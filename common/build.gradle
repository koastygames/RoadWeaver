architectury {
    common("fabric")
}

dependencies {
    // Common code compiles against Fabric Loader and Architectury, while the Fabric module supplies runtime artifacts.
    implementation("dev.architectury:architectury:${project.architectury_version}")
    compileOnly("net.fabricmc:fabric-loader:${project.loader_version}")

    // H2 is shaded and relocated by the Fabric module.
    compileOnly("com.h2database:h2:2.2.224")
}

sourceSets {
    main {
        java {
            exclude 'net/shiroha233/roadweaver/client/gui/**'
        }
        resources {
            exclude 'pack.mcmeta'
        }
    }
}
