plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "roadweaver.mixins.json"
    }
    runs {
        client {
            client()
            name "Forge Client"
            runDir "run/client"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
            programArgs "--username", "Player1"
        }
        server {
            server()
            name "Forge Server"
            runDir "run/server"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    shadowSqlite
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowSqlite]
    archiveClassifier.set("dev-shadow")
    
    // 重定位 SQLite JDBC 包，长度设为 10 以便进行二进制等长替换
    // org.sqlite (10) -> net.road.w (10)
    relocate 'org.sqlite', 'net.road.w'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
}

// 修复 SQLite Native 库中的 JNI 符号
import java.nio.file.*
task fixSqliteNatives {
    doLast {
        File file = shadowJar.archiveFile.get().asFile
        if (!file.exists()) return

        Path zipPath = file.toPath()
        Map<String, String> env = new HashMap<>()
        env.put("create", "false")
        
        FileSystem fs = FileSystems.newFileSystem(zipPath, null as ClassLoader)
        try {
            Files.walk(fs.getPath("/")).filter { 
                it.toString().endsWith(".dll") || it.toString().endsWith(".so") || it.toString().endsWith(".dylib") 
            }.forEach { nativePath ->
                println "Patching native symbols in: " + nativePath
                byte[] bytes = Files.readAllBytes(nativePath)
                
                // 替换 "org_sqlite" -> "net_road_w" (JNI 符号)
                // 替换 "org/sqlite" -> "net/road/w" (内部路径)
                bytes = replaceBytesInternal(bytes, "org_sqlite".getBytes("UTF-8"), "net_road_w".getBytes("UTF-8"))
                bytes = replaceBytesInternal(bytes, "org/sqlite".getBytes("UTF-8"), "net/road/w".getBytes("UTF-8"))
                
                Files.write(nativePath, bytes)
            }
        } finally {
            fs.close()
        }
    }
}

// 辅助方法：执行等长字节替换
def replaceBytesInternal(byte[] source, byte[] target, byte[] replacement) {
    if (target.length != replacement.length) return source
    for (int i = 0; i <= source.length - target.length; i++) {
        boolean match = true
        for (int j = 0; j < target.length; j++) {
            if (source[i + j] != target[j]) {
                match = false
                break
            }
        }
        if (match) {
            for (int j = 0; j < target.length; j++) {
                source[i + j] = replacement[j]
            }
        }
    }
    return source
}

shadowJar.finalizedBy(fixSqliteNatives)

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'roadweaver',
        mod_name: 'RoadWeaver',
        mod_version: project.version,
        mod_authors: 'shiroha233',
        mod_description: 'Automatically generates roads between structures'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional compat mods (dev only)
    modCompileOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false } // GlitchCore
    modCompileOnly("maven.modrinth:e0bNACJD:9.1.0.0") { transitive = false } // SereneSeasons Forge 1.20.1
    modRuntimeOnly("maven.modrinth:s3dmwKy5:0.0.1.1") { transitive = false }
    modRuntimeOnly("maven.modrinth:e0bNACJD:9.1.0.0") { transitive = false }
    modCompileOnly("curse.maven:the-lost-cities-269024:6174986") { transitive = false } // The Lost Cities 1.20-7.3.6
    modRuntimeOnly("curse.maven:the-lost-cities-269024:6174986") { transitive = false }

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:9.2.14")
    include("dev.architectury:architectury-forge:9.2.14")

    // Cloth Config API for Forge - Jar-in-Jar include
    modApi("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    include("me.shedaniel.cloth:cloth-config-forge:11.1.136")

    // SQLite JDBC - 道路数据持久化（内嵌到模组）
    // developmentForge 确保开发环境下驱动可用
    developmentForge("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
    shadowSqlite("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }

    // 联动兼容 动态的树 Dynamic Trees
    // 换成modCompileOnly可以临时关闭此mod的运行以测试非联动状态
    modImplementation("maven.modrinth:dynamictrees:${minecraft_version}-${dynamictrees_version}")
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
        }
    }
}
