plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "roadweaver.mixins.json"
    }
    runs {
        client {
            client()
            name "Forge Client"
            runDir "run/client"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
            programArgs "--username", "Player1"
        }
        server {
            server()
            name "Forge Server"
            runDir "run/server"
            vmArgs "-Dneoforge.enabledGameTestNamespace=roadweaver"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://api.modrinth.com/maven"
        name "Modrinth"
    }
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'roadweaver',
        mod_name: 'RoadWeaver',
        mod_version: project.version,
        mod_authors: 'shiroha233',
        mod_description: 'Automatically generates roads between structures'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Kotlin runtime（开发运行时需要，否则会在启动时找不到 kotlin.jvm.internal.Intrinsics）
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    common("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    shadowCommon("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    include("org.jetbrains.kotlin:kotlin-stdlib-jdk8")

    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:9.2.14")
    include("dev.architectury:architectury-forge:9.2.14")

    // Cloth Config API for Forge - Jar-in-Jar include
    modApi("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    include("me.shedaniel.cloth:cloth-config-forge:11.1.136")

    // SQLite JDBC - 道路数据持久化（内嵌到模组）
    // developmentForge 确保开发环境下驱动可用
    developmentForge("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
    implementation("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }
    include("org.xerial:sqlite-jdbc:3.45.3.0") { transitive = false }

    // 联动兼容 动态的树 Dynamic Trees
    // 使用 compileOnly：
    // - 允许编译期引用 DynamicTrees API（mixin 类能编译）
    // - 不会把 DynamicTrees 作为强制运行依赖/打包进产物
    // - 未安装 DynamicTrees 时也能正常启动
    // Modrinth Maven 的版本号通常形如 "1.20.1-1.4.1"
    modCompileOnly("maven.modrinth:dynamictrees:1.20.1-1.4.1")
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
        }
    }
}
