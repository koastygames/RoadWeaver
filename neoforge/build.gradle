// NeoForge-only Minecraft 26.2 build. Minecraft 26.2 is unobfuscated, so no remap step is used.
plugins {
    id 'com.gradleup.shadow'
}

architectury {
    neoForge()
}

def compatNeoForgeDir = layout.buildDirectory.dir("generated/sources/roadweaver26/main/java")

configurations {
    shadowCommon
    shadowH2
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        url = "https://maven.neoforged.net/releases/"
        name = "NeoForge"
    }
}

dependencies {
    common(project(path: ":common")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"

    compileOnly("com.h2database:h2:2.2.224") { transitive = false }
    runtimeOnly("com.h2database:h2:2.2.224") { transitive = false }
    shadowH2("com.h2database:h2:2.2.224") { transitive = false }
}

processResources {
    def replaceProperties = [
        minecraft_version_range: '[26.2,26.3)',
        neoforge_version_range: '[26.2.0.62,)',
        loader_version_range: '[4,)',
        mod_version: project.version.toString()
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

// Copy the NeoForge implementation into a 26.2 compatibility tree while preserving the legacy
// source for older branches. New native 26.2 client/network sources intentionally survive the
// exclusions below, while the NeoForge client bootstrap uses its own package to avoid Java modules
// seeing a split package between the transformed common JAR and the loader JAR.
tasks.register("generateRoadWeaverNeoForge26Compat", Copy) {
    from("src/main/java")
    into(compatNeoForgeDir)

    // Retired pre-26.2 client GUI implementation. The new native implementation lives in client26.
    exclude 'net/shiroha233/roadweaver/client/**'
    exclude 'net/shiroha233/roadweaver/datagen/**'

    // Retired pre-26.2 packet implementation. The new split protocol lives in network26.
    exclude 'net/shiroha233/roadweaver/network/**'

    // Optional DynamicTrees integration is kept off for the first 26.2 runtime-compatible build.
    exclude 'net/shiroha233/roadweaver/mixin/neoforge/dynamictree/**'

    // Client-only legacy mixins target the removed GuiGraphics rendering path.
    exclude 'net/shiroha233/roadweaver/mixin/neoforge/CreateWorldScreenMixin.java'
    exclude 'net/shiroha233/roadweaver/mixin/neoforge/CreateWorldScreenInitMixin.java'
    exclude 'net/shiroha233/roadweaver/mixin/neoforge/LevelLoadingScreenMixin.java'
    exclude 'net/shiroha233/roadweaver/mixin/neoforge/BiomeGrassColorFailSafeMixin.java'

    filter { String line ->
        line
            .replace("player.chunkPosition().x", "player.chunkPosition().x()")
            .replace("player.chunkPosition().z", "player.chunkPosition().z()")
            .replace("candidate.x", "candidate.x()")
            .replace("candidate.z", "candidate.z()")
            .replace("chunkPos.x", "chunkPos.x()")
            .replace("chunkPos.z", "chunkPos.z()")
            .replace("ChunkPos.asLong(", "ChunkPos.pack(")
            .replace("chunkPos.toLong()", "chunkPos.pack()")
            .replace("new ChunkPos(pos)", "ChunkPos.containing(pos)")
            .replace("new ChunkPos(anchor)", "ChunkPos.containing(anchor)")
            .replace("new ChunkPos(chunkLong)", "ChunkPos.unpack(chunkLong)")
    }

    doLast {
        // Replace the legacy loader entrypoint with a 26.2 entrypoint. Client-only classes are
        // reached only behind the physical-client check, keeping dedicated-server classloading safe.
        def target = compatNeoForgeDir.get().file("net/shiroha233/roadweaver/RoadWeaver.java").asFile
        target.parentFile.mkdirs()
        target.text = '''package net.shiroha233.roadweaver;

import net.neoforged.api.distmarker.Dist;
import net.neoforged.bus.api.IEventBus;
import net.neoforged.fml.ModContainer;
import net.neoforged.fml.common.Mod;
import net.neoforged.fml.loading.FMLLoader;
import net.neoforged.neoforge.common.NeoForge;
import net.neoforged.neoforge.event.RegisterCommandsEvent;
import net.neoforged.neoforge.event.entity.player.PermissionsChangedEvent;
import net.neoforged.neoforge.event.entity.player.PlayerEvent;
import net.shiroha233.roadweaver.command.MapAccessCommand;
import net.shiroha233.roadweaver.config.ConfigService;
import net.shiroha233.roadweaver.features.neoforge.RoadFeaturesNeoForge;
import net.shiroha233.roadweaver.network26.MapNetworkNeoForge26;
import net.shiroha233.roadweaver.planning.neoforge.ServerPlanningHooks;
import net.shiroha233.roadweaver.structures.neoforge.StructureRegistryNeoForge;
import org.slf4j.Logger;
import org.slf4j.LoggerFactory;

@Mod(RoadWeaver.MOD_ID)
public final class RoadWeaver {
    public static final String MOD_ID = "roadweaver";
    private static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

    public RoadWeaver(IEventBus modEventBus, ModContainer modContainer) {
        LOGGER.info("Initializing RoadWeaver for Minecraft 26.2 NeoForge...");
        ConfigService.load();
        StructureRegistryNeoForge.register(modEventBus);
        RoadFeaturesNeoForge.register(modEventBus);
        MapNetworkNeoForge26.register(modEventBus);
        ServerPlanningHooks.register(modEventBus);

        NeoForge.EVENT_BUS.addListener(this::onRegisterCommands);
        NeoForge.EVENT_BUS.addListener(this::onPlayerLoggedIn);
        NeoForge.EVENT_BUS.addListener(this::onPermissionsChanged);

        FMLLoader loader = FMLLoader.getCurrentOrNull();
        if (loader != null && loader.getDist() == Dist.CLIENT) {
            net.shiroha233.roadweaver.neoclient26.NeoForgeClient26.register(modEventBus, modContainer);
        }
    }

    private void onRegisterCommands(RegisterCommandsEvent event) {
        MapAccessCommand.register(event.getDispatcher());
    }

    private void onPlayerLoggedIn(PlayerEvent.PlayerLoggedInEvent event) {
        if (event.getEntity() instanceof net.minecraft.server.level.ServerPlayer player) {
            MapNetworkNeoForge26.syncMapAccess(player);
        }
    }

    private void onPermissionsChanged(PermissionsChangedEvent event) {
        if (event.getEntity() instanceof net.minecraft.server.level.ServerPlayer player) {
            MapNetworkNeoForge26.syncMapAccess(player);
        }
    }

    public static Logger getLogger() {
        return LOGGER;
    }
}
'''
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon, project.configurations.shadowH2]
    archiveClassifier.set("")

    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    relocate 'org.h2', 'net.shiroha233.roadweaver.libs.h2'

    exclude 'META-INF/versions/**'
    exclude 'org/h2/util/SourceCompiler*'
    exclude 'org/h2/tools/**'
    exclude 'org/h2/server/**'
    exclude 'net/shiroha233.roadweaver/libs/h2/util/SourceCompiler*'
    exclude 'net/shiroha233.roadweaver/libs/h2/tools/**'
    exclude 'net/shiroha233.roadweaver/libs/h2/server/**'
    mergeServiceFiles()
    exclude 'module-info.class'

    from("${rootProject.projectDir}/LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named('generateRoadWeaverNeoForge26Compat')
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateRoadWeaverNeoForge26Compat')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

sourceSets {
    main {
        java.setSrcDirs([compatNeoForgeDir])
        resources {
            exclude 'assets/roadweaver/lang/*.json'
            exclude 'pack.mcmeta'
        }
    }
}