plugins {
	id 'com.gradleup.shadow' version '8.3.6'
	id 'org.jetbrains.kotlin.jvm'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'RoadWeaver',
			'Specification-Vendor'    : 'shiroha233',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'shiroha233'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url = "https://api.modrinth.com/maven"
        name = "Modrinth Maven"
    }
    maven {
        url "https://bmclapi2.bangbang93.com/maven/"
        name "NeoForge Mirror"
    }
    maven {
        url "https://maven.neoforged.net/releases/"
        name "NeoForge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        neoforge_version: project.neoforge_version,
        neoforge_version_range: '[21.1,)',
        loader_version_range: '[4,)',
        mod_id: 'roadweaver',
        mod_name: 'RoadWeaver',
        mod_version: project.version,
        mod_authors: 'shiroha233',
        mod_description: 'Automatically generates roads between structures'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    // NeoForge 平台
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-neoforge:${project.architectury_version}")
    include("dev.architectury:architectury-neoforge:${project.architectury_version}")

    // Cloth Config API for NeoForge - Jar-in-Jar include
    modApi("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    include("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
    
    // DynamicTrees - 可选依赖，用于 Mixin 兼容
    modCompileOnly "maven.modrinth:vdjF5PL5:${project.dynamictrees_version}"
    modRuntimeOnly "maven.modrinth:vdjF5PL5:${project.dynamictrees_version}"

    // Touhou Little Maid (车万女仆)
    modRuntimeOnly "maven.modrinth:R0bDWFAW:${project.touhou_little_maid_neoforge_version}"

    // SQLite JDBC - 道路数据持久化（内嵌到模组）
    developmentNeoForge("org.xerial:sqlite-jdbc:3.45.1.0") { transitive = false }
    implementation("org.xerial:sqlite-jdbc:3.45.1.0") { transitive = false }
    include("org.xerial:sqlite-jdbc:3.45.1.0") { transitive = false }
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/roadweaver/lang/*.json'
        }
    }
}
